<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function Supplier(){
            this.name="";
            this.code="";
            this.Show= function(){
                alert(this.name);
            }
        }
        function SupplierChild(){
            this.Show= function(){
                alert(this.name + " "  + this.code);
            }
        }
        SupplierChild.prototype = new Supplier();
        
        var x = new Supplier();
        x.name = "Shiv";
        x.code = "Shiv1001";
        x.Show();

        var x = new SupplierChild();
        x.name = "Shiv";
        x.code = "Shiv1001";
        x.Show();
    </script>
</body>
</html>
