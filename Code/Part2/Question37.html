<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        class Supplier{
            constructor(_name,_code){
                this.name=_name;
                this.code=_code;
            }
            Show(){
                alert(this.name);
            }
        }
        
        class SupplierChild extends Supplier{
            Show(){
                alert(this.name + " "  + this.code);
            }
        }
        
        Supplier();
        var x = new Supplier();
        x.name = "Shiv";
        x.code = "Shiv1001";
        x.Show();

        var x = new SupplierChild();
        x.name = "Shiv";
        x.code = "Shiv1001";
        x.Show();
    </script>
</body>
</html>
