    <script>
        //54. What is a WebAPI/Browser API ?
		//55. What is a Event loop and callback queue?
        function DisplayAlert(){
            alert("I am blocking fun3")
        }
        function fun1(){
            console.log("Fun1");
            fun2();
        }
        
        function fun2(){
            console.log("Fun2");
            setTimeout(() => DisplayAlert(),0)
            fun3();
        }
        function fun3(){
            console.log("Fun3");
        }
        fun1();
        
       </script>
